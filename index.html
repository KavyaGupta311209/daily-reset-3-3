<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Reset</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  .container {
    max-width: 400px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
  }
  h1 {
    text-align: center;
    margin-bottom: 5px;
  }
  p.subtitle {
    text-align: center;
    color: gray;
    font-size: 14px;
  }
  input[type="text"], textarea {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid #ddd;
  }
  textarea {
    height: 80px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: black;
    color: white;
    cursor: pointer;
  }
  .output {
    margin-top: 15px;
    padding: 10px;
    background: #f1f1f1;
    border-radius: 8px;
  }
  .mode {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
  }
</style>
</head>

<body>
<div class="container">
  <h1>Daily Reset</h1>
  <p class="subtitle">3 things. No excuses.</p>

  <div class="mode">
    <label><input type="radio" name="mode" value="calm" checked> Calm</label>
    <label><input type="radio" name="mode" value="strict"> Strict</label>
  </div>

  <!-- Tasks -->
  <div class="task">
    <input type="checkbox" id="t1check">
    <input type="text" id="t1" placeholder="Task 1">
  </div>

  <div class="task">
    <input type="checkbox" id="t2check">
    <input type="text" id="t2" placeholder="Task 2">
  </div>

  <div class="task">
    <input type="checkbox" id="t3check">
    <input type="text" id="t3" placeholder="Task 3">
  </div>

  <!-- Reflection -->
  <textarea id="reflection" placeholder="What did you actually do today?"></textarea>

  <button onclick="generateResponse()">Get Reality Check</button>

  <div class="output" id="output"></div>
</div>

<script>
function generateResponse() {
  let done = 0;
  if (document.getElementById("t1check").checked) done++;
  if (document.getElementById("t2check").checked) done++;
  if (document.getElementById("t3check").checked) done++;

  let mode = document.querySelector('input[name="mode"]:checked').value;
  let response = "";

  if (mode === "calm") {
    if (done === 3) {
      response = "You showed up fully today. Every single task completed, every commitment honored. This is the foundation of real progress and self-respect. Keep this rhythm, and watch how it compounds over time. You're building something meaningful here.";
    } else if (done === 2) {
      response = "Good effort on two tasks, but that third one lingered undone. You know deep down you held back a little. Reflect on why—was it fear, distraction, or just a momentary lapse? Tomorrow, push through that resistance. You've got more in you than you showed today.";
    } else if (done === 1) {
      response = "You started strong with one task, but the momentum faded along the way. Starting is important, but following through is what builds character and creates lasting change. Be more intentional with your energy and focus next time. You deserve better from yourself.";
    } else {
      response = "Today slipped away without the non-negotiables getting done. No judgment here, just honest reflection: this pattern won't serve you long-term. Tomorrow needs more commitment and less avoidance. Take a deep breath, reset, and show up differently.";
    }
  } else {
    if (done === 3) {
      response = "Good. That's the standard now. No room for excuses, no settling for less. Keep executing at this level. Excellence isn't optional—it's required. Push harder tomorrow.";
    } else if (done === 2) {
      response = "One task left unfinished. You chose not to complete it. Was it weakness or distraction? Either way, it's unacceptable. You know what needs to be done—finish what you start, no matter what. Stop making exceptions for yourself.";
    } else if (done === 1) {
      response = "You barely showed up. That's not your level. You're capable of so much more than this half-hearted effort. Stop settling for mediocrity. Get serious about your goals or stay stuck in the same place forever.";
    } else {
      response = "No excuses. You avoided everything today. This is failure by choice, and it's completely on you. If you want different results, you have to do different things. Get serious or accept that you're not serious about change.";
    }
  }

  document.getElementById("output").innerText = response;
}
</script>

</body>
</html>
