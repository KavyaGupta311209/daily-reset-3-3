<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Reset</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f7f7f7;
    margin: 0;
    padding: 20px;
    color: #222;
  }
  .container {
    max-width: 400px;
    margin: auto;
    background: white;
    padding: 20px;
    border-radius: 12px;
  }
  h1 {
    text-align: center;
    margin-bottom: 5px;
  }
  p.subtitle {
    text-align: center;
    color: gray;
    font-size: 14px;
  }
  input[type="text"], textarea {
    width: 100%;
    padding: 10px;
    margin: 6px 0;
    border-radius: 8px;
    border: 1px solid #ddd;
  }
  textarea {
    height: 80px;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border: none;
    border-radius: 8px;
    background: black;
    color: white;
    cursor: pointer;
  }
  .output {
    margin-top: 15px;
    padding: 10px;
    background: #f1f1f1;
    border-radius: 8px;
  }
  .mode {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
  }
</style>
</head>

<body>
<div class="container">
  <h1>Daily Reset</h1>
  <p class="subtitle">3 things. No excuses.</p>

  <div class="mode">
    <label><input type="radio" name="mode" value="calm" checked> Calm</label>
    <label><input type="radio" name="mode" value="strict"> Strict</label>
  </div>

  <!-- Tasks -->
  <div class="task">
    <input type="checkbox" id="t1check">
    <input type="text" id="t1" placeholder="Task 1">
  </div>

  <div class="task">
    <input type="checkbox" id="t2check">
    <input type="text" id="t2" placeholder="Task 2">
  </div>

  <div class="task">
    <input type="checkbox" id="t3check">
    <input type="text" id="t3" placeholder="Task 3">
  </div>

  <!-- Reflection -->
  <textarea id="reflection" placeholder="What did you actually do today?"></textarea>

  <button onclick="generateResponse()">Get Reality Check</button>

  <div class="output" id="output"></div>
</div>

<script>
function generateResponse() {
  let done = 0;
  if (document.getElementById("t1check").checked) done++;
  if (document.getElementById("t2check").checked) done++;
  if (document.getElementById("t3check").checked) done++;

  let mode = document.querySelector('input[name="mode"]:checked').value;
  let reflection = document.getElementById("reflection").value.trim();
  let response = "";

  let reflectionNote = reflection ? `\n\nBased on your reflection: "${reflection}"\n\n` : "\n\n";

  if (mode === "calm") {
    if (done === 3) {
      response = `Congratulations! You've completed all three non-negotiable tasks today. This is a powerful demonstration of discipline and commitment. When you show up fully like this, you're not just checking boxes—you're building momentum that compounds over time. 

Think about how this completion feels. That sense of accomplishment? That's your brain rewarding you for aligning your actions with your intentions. Keep nurturing this rhythm. Tomorrow, build on this foundation. What small adjustment could make this even smoother? Perhaps preparing your tasks the night before, or finding an accountability partner. 

Remember, consistency in these fundamentals creates the space for everything else in life to flourish. You're not just doing tasks; you're crafting the life you want. Well done—keep going.${reflectionNote}If your reflection mentions specific challenges you overcame, celebrate those wins. If it highlights what energized you, lean into that for future days.`;
    } else if (done === 2) {
      response = `Two out of three tasks completed— that's solid progress, but let's explore why that third one remained undone. You know you held back a little, and that's okay to acknowledge. Sometimes it's fatigue, sometimes distraction, sometimes just the natural resistance that comes with pushing boundaries.

The key insight here is recognizing the pattern. Did the third task feel more daunting? Was it less urgent? Or did momentum simply fade? Use this as data for tomorrow. Break that remaining task into smaller steps, or tackle it first next time.

You're capable of more than you showed today, and that's not a criticism—it's an invitation. Reflect on what "holding back" looks like for you. Is it procrastination? Perfectionism? Fear of failure? Addressing this consciously will accelerate your growth.${reflectionNote}Your reflection might reveal the real story behind that unfinished task. Use it to plan better tomorrow.`;
    } else if (done === 1) {
      response = `One task down, two to go. You started strong, which is commendable, but the follow-through faded. Starting is half the battle, but completion is where transformation happens. What shifted between the first task and the others? Energy levels? Motivation? External distractions?

Be more intentional tomorrow. Before beginning, visualize completing all three. Set micro-deadlines. Remove distractions. Remember why these tasks matter to you—the bigger picture that makes the effort worthwhile.

This isn't about beating yourself up; it's about understanding your patterns. You have the capability; it's about deploying it consistently. Small adjustments in focus and energy management can make a world of difference.${reflectionNote}If your reflection explains what derailed you after the first task, use that insight to create safeguards for next time.`;
    } else {
      response = `Zero tasks completed today. This happens to everyone at some point, and it's not the end of the world—but it is a signal. Today slipped away without the non-negotiables being addressed. No judgment here, just honest assessment: this pattern, if repeated, won't get you where you want to go.

The good news? Tomorrow is a fresh start. Use today as motivation to reset with intention. Why did today go this way? Overwhelm? Low energy? Lack of clarity? Identify the root cause and address it proactively.

Remember, your non-negotiables exist for a reason. They're the foundation. When you honor them, everything else becomes possible. When you don't, life feels more chaotic. Choose differently tomorrow. You deserve the momentum that comes from showing up.${reflectionNote}Your reflection might hold the key to why today was different. Use it to rebuild your commitment.`;
    }
  } else {
    if (done === 3) {
      response = `Acceptable. You've met the minimum standard today. But remember: good enough yesterday becomes the floor for tomorrow. Excellence isn't a destination; it's a daily practice. No room for complacency. 

What made today work? Replicate it. What almost derailed you? Eliminate it. This is your baseline now—push beyond it. Weakness shows up in the details. Stay vigilant. Execute harder tomorrow. No excuses, no exceptions.${reflectionNote}If your reflection shows any hesitation or close calls, that's your growth edge. Crush it next time.`;
    } else if (done === 2) {
      response = `Two down, one left unfinished. You chose not to complete it. That's a choice with consequences. Was it laziness? Distraction? Fear? Own it. You know what needs to be done—finish what you start, regardless of how you feel.

This half-measure approach is costing you. Momentum builds with completion, not partial effort. Tomorrow, commit fully or don't start. There's no middle ground here. You're better than this inconsistency. Step up.${reflectionNote}Your reflection probably explains the excuse. Reject it. Finish strong tomorrow.`;
    } else if (done === 1) {
      response = `Barely showed up. One task? That's not your level. You're capable of so much more than this minimal effort. Stop settling for scraps of progress. If you're serious about change, prove it with action, not words.

This pattern of partial engagement is self-sabotage. Why bother starting if you won't finish? Get real with yourself. Either commit fully or admit you're not ready. Mediocrity is comfortable, but it won't get you anywhere meaningful.${reflectionNote}If your reflection justifies this low bar, you're lying to yourself. Raise the standard.`;
    } else {
      response = `Zero. Nothing. Complete avoidance. This is failure by choice, and it's entirely on you. No excuses, no stories, no justifications. You avoided your responsibilities today, and that's unacceptable.

If you want different results, you have to do different things. Stop pretending. Get serious or stay stuck. The choice is yours, but inaction has consequences. Tomorrow demands better. No more hiding.${reflectionNote}Whatever your reflection says, it's probably an excuse. Cut the bullshit. Execute tomorrow.`;
    }
  }

  document.getElementById("output").innerText = response;
}
</script>

</body>
</html>
