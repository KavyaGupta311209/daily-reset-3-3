<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Reset</title>
<style>
  * {
    box-sizing: border-box;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    color: #333;
  }
  .container {
    max-width: 500px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  h1 {
    text-align: center;
    margin: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .settings-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
  }
  p.subtitle {
    text-align: center;
    color: #667eea;
    font-size: 14px;
    margin: 5px 0 20px 0;
  }
  input[type="text"], textarea, select {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: 2px solid #e0e7ff;
    font-family: inherit;
    transition: border-color 0.3s;
  }
  input[type="text"]:focus, textarea:focus, select:focus {
    outline: none;
    border-color: #667eea;
  }
  textarea {
    height: 100px;
    resize: vertical;
  }
  .task {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 10px 0;
  }
  input[type="checkbox"] {
    width: 20px;
    height: 20px;
    cursor: pointer;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
  }
  .output {
    margin-top: 20px;
    padding: 15px;
    background: linear-gradient(135deg, #f0f4ff 0%, #f5f2ff 100%);
    border-radius: 8px;
    border-left: 4px solid #667eea;
    line-height: 1.6;
    max-height: 500px;
    overflow-y: auto;
  }
  .mode {
    display: flex;
    justify-content: space-between;
    margin: 15px 0;
    padding: 10px;
    background: #f0f4ff;
    border-radius: 8px;
  }
  .mode label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .page {
    display: none;
  }
  .page.active {
    display: block;
    animation: fadeIn 0.3s ease-in;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .page h2 {
    color: #667eea;
    margin-top: 0;
  }
  .loading {
    text-align: center;
    color: #667eea;
    font-style: italic;
  }
  .error {
    color: #e74c3c;
    padding: 10px;
    background: #fadbd8;
    border-radius: 8px;
    margin: 10px 0;
  }
  .settings-panel {
    padding: 15px;
    background: #f0f4ff;
    border-radius: 8px;
    margin-bottom: 15px;
  }
  .close-btn {
    background: none;
    border: none;
    font-size: 24px;
    cursor: pointer;
    color: #667eea;
  }
</style>
</head>

<body>
<div class="container">
  <div class="header">
    <h1>Daily Reset</h1>
    <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
  </div>
  <p class="subtitle">3 things. No excuses.</p>

  <!-- Settings Panel -->
  <div id="settingsPanel" style="display:none;">
    <div class="settings-panel">
      <h3 style="color: #667eea; margin-top: 0;">API Configuration</h3>
      <label>OpenAI API Key:</label>
      <input type="password" id="apiKey" placeholder="sk-..." value="">
      <button onclick="saveApiKey()">Save API Key</button>
      <p style="font-size: 12px; color: #666;">Your API key is stored locally in your browser. Get one at <a href="https://platform.openai.com/api-keys" target="_blank">platform.openai.com</a></p>
    </div>
  </div>

  <!-- Page 1: Task Setup -->
  <div id="page1" class="page active">
    <h2>Step 1: Set Your Tasks</h2>
    <div class="task">
      <input type="checkbox" id="t1check">
      <input type="text" id="t1" placeholder="Task 1">
    </div>
    <div class="task">
      <input type="checkbox" id="t2check">
      <input type="text" id="t2" placeholder="Task 2">
    </div>
    <div class="task">
      <input type="checkbox" id="t3check">
      <input type="text" id="t3" placeholder="Task 3">
    </div>
    <button onclick="nextPage(2)">Next: Emotional Reset</button>
  </div>

  <!-- Page 2: Emotional Reset -->
  <div id="page2" class="page">
    <h2>Step 2: Emotional Reset</h2>
    <label for="emotions">How are you feeling right now? (select all that apply)</label>
    <select id="emotions" multiple>
      <option value="happy">😊 Happy</option>
      <option value="sad">😢 Sad</option>
      <option value="anxious">😰 Anxious</option>
      <option value="angry">😠 Angry</option>
      <option value="motivated">💪 Motivated</option>
      <option value="tired">😴 Tired</option>
      <option value="excited">🤩 Excited</option>
      <option value="frustrated">😤 Frustrated</option>
      <option value="grateful">🙏 Grateful</option>
      <option value="overwhelmed">😵 Overwhelmed</option>
    </select>
    <textarea id="reflection" placeholder="What did you actually do today? Reflect on your day, your progress, and your feelings..."></textarea>
    <button onclick="nextPage(3)">Next: Reality Check</button>
  </div>

  <!-- Page 3: Reality Check -->
  <div id="page3" class="page">
    <h2>Step 3: Reality Check</h2>
    <div class="mode">
      <label><input type="radio" name="mode" value="calm" checked> 🌿 Calm</label>
      <label><input type="radio" name="mode" value="strict"> ⚡ Strict</label>
    </div>
    <button onclick="generateResponse()">Get Reality Check</button>
    <div class="output" id="output"></div>
    <button onclick="resetApp()">Start Over</button>
  </div>
</div>

<script>
let currentPage = 1;

function toggleSettings() {
  const panel = document.getElementById('settingsPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  if (panel.style.display === 'block') {
    document.getElementById('apiKey').value = localStorage.getItem('openai_api_key') || '';
  }
}

function saveApiKey() {
  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) {
    alert('Please enter an API key');
    return;
  }
  localStorage.setItem('openai_api_key', apiKey);
  alert('API key saved successfully!');
  toggleSettings();
}

function nextPage(page) {
  document.getElementById('page' + currentPage).classList.remove('active');
  currentPage = page;
  document.getElementById('page' + currentPage).classList.add('active');
}

function resetApp() {
  document.getElementById('page3').classList.remove('active');
  currentPage = 1;
  document.getElementById('page1').classList.add('active');
  document.getElementById("t1check").checked = false;
  document.getElementById("t2check").checked = false;
  document.getElementById("t3check").checked = false;
  document.getElementById("t1").value = "";
  document.getElementById("t2").value = "";
  document.getElementById("t3").value = "";
  document.getElementById("emotions").selectedIndex = -1;
  document.getElementById("reflection").value = "";
  document.getElementById("output").innerText = "";
}

async function generateResponse() {
  const done = [
    document.getElementById("t1check").checked,
    document.getElementById("t2check").checked,
    document.getElementById("t3check").checked
  ].filter(c => c).length;

  const mode = document.querySelector('input[name="mode"]:checked').value;
  const reflection = document.getElementById("reflection").value.trim();
  const emotions = Array.from(document.getElementById("emotions").selectedOptions).map(option => option.value);
  const tasks = [
    document.getElementById("t1").value.trim(),
    document.getElementById("t2").value.trim(),
    document.getElementById("t3").value.trim()
  ].filter(t => t);

  const outputDiv = document.getElementById("output");
  outputDiv.innerHTML = '<div class="loading">🤔 Generating your personalized reality check...</div>';

  const apiKey = localStorage.getItem('openai_api_key');
  
  if (!apiKey) {
    outputDiv.innerHTML = '<div class="error">⚠️ Please configure your OpenAI API key first. Click the ⚙️ button above.</div>';
    return;
  }

  const prompt = `You are a compassionate but honest life coach providing a reality check. The user has:
- Completed ${done} out of 3 daily tasks
- Tasks: ${tasks.join(', ') || 'Not specified'}
- Current emotions: ${emotions.join(', ') || 'Not specified'}
- Mode: ${mode} (${mode === 'calm' ? 'supportive and encouraging' : 'direct and challenging'})
- Reflection: "${reflection}"

Generate a personalized, empathetic reality check (3-5 paragraphs) that:
1. Acknowledges their emotional state
2. Provides honest feedback about their task completion
3. Offers specific, actionable advice
4. Includes encouragement or challenge based on their mode
5. Uses warm, conversational language with occasional emojis

Keep the response under 400 words.`;

  try {
    const response = await fetch('https://api.openai.com/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: 'gpt-3.5-turbo',
        messages: [
          { role: 'system', content: 'You are a compassionate but honest life coach.' },
          { role: 'user', content: prompt }
        ],
        temperature: 0.8,
        max_tokens: 500
      })
    });

    if (!response.ok) {
      const error = await response.json();
      throw new Error(error.error?.message || 'API request failed');
    }

    const data = await response.json();
    const aiResponse = data.choices[0].message.content;
    outputDiv.innerHTML = aiResponse.replace(/\n/g, '<br>');
  } catch (error) {
    outputDiv.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
  }
}
</script>

</body>
</html>
